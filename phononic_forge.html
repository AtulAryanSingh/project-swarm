<!DOCTYPE html>
<html>
<head>
    <title>Phononic Forge</title>
    <style>
        body { background-color: #0d1117; color: white; font-family: sans-serif; text-align: center; }
        canvas { background-color: #161b22; border-radius: 8px; box-shadow: 0 0 20px rgba(255,51,102,0.1); margin-top: 20px;}
        input[type=range] { width: 300px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>Module 4: The Phononic Forge (Von Neumann Assembly)</h2>
    <label for="resonanceSlider">Acoustic Resonance Power: <span id="resVal">0</span>%</label><br>
    <input type="range" id="resonanceSlider" min="0" max="100" value="0">
    <br>
    <canvas id="forgeCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("forgeCanvas");
        const ctx = canvas.getContext("2d");
        const slider = document.getElementById("resonanceSlider");
        const valText = document.getElementById("resVal");

        let particles = [];
        let waveRadius = 0;

        function spawnDust() {
            particles.push({
                x: 0, 
                y: 100 + Math.random() * 200,
                vx: 1.5 + Math.random(),      
                vy: (Math.random() - 0.5),    
                isForged: false,
                color: "#6e7681",             
                size: 2
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let resonance = parseInt(slider.value);
            valText.innerText = resonance;

            ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(400, 200, 120, 0, Math.PI * 2); ctx.stroke();

            if (resonance > 50) {
                waveRadius += 2;
                if (waveRadius > 120) waveRadius = 0;
                ctx.strokeStyle = `rgba(255, 51, 102, ${(120 - waveRadius)/120})`;
                ctx.beginPath(); ctx.arc(400, 200, waveRadius, 0, Math.PI * 2); ctx.stroke();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                let inForge = p.x > 280 && p.x < 520;

                if (inForge && resonance > 50) {
                    p.isForged = true;
                    p.color = "#ff3366"; 
                    p.size = 3;
                    
                    p.vy = 0; 
                    p.y += (Math.round(p.y / 15) * 15 - p.y) * 0.1; 
                }

                if (p.x > 520 && p.isForged) {
                    p.color = "#00e5ff"; 
                    p.vx = 2.5; 
                }

                ctx.fillStyle = p.color;
                ctx.beginPath();
                if (p.isForged) {
                    ctx.fillRect(p.x, p.y, p.size*2, p.size*2); 
                } else {
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); 
                }
                ctx.fill();

                if (p.x > canvas.width) particles.splice(i, 1);
            }

            requestAnimationFrame(animate);
        }

        setInterval(spawnDust, 30); 
        animate();
    </script>
</body>
</html>
