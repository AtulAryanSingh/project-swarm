<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Swarm | 4D COSMIC TERMINAL ESTABLISHED</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #010206;
            --hud-data: #ffea00; /* Primary gold/solar energy */
            --hud-cyan: #00f0ff; /* Software/AI layer */
            --hud-pink: #ff0055; /* Entropy/Forge */
            --text-main: #8da1b9;
        }

        body {
            margin: 0; padding: 0; 
            width: 100%; min-height: 100vh;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden; /* Lock the viewport, the simulation fills it */
            cursor: crosshair;
        }

        /* 1. The Living 4D Cosmic Background (GLSL Shader Canvas) */
        canvas#deep-cosmos {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }

        /* 2. Interactive 3D WebGL Canvas (The Swarm Engine) */
        canvas#webgl-engine {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
        }

        /* 3. Immersive HUD (Heads Up Display) Overlay */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
            pointer-events: none; /* Let clicks pass through to the simulation */
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 40px; box-sizing: border-box;
            background: radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.8) 100%);
        }

        /* Title Area (Top Left) */
        .brand h1 {
            font-family: 'Orbitron', sans-serif; font-size: 3.5rem; margin: 0 0 5px 0; letter-spacing: 8px;
            color: #fff; text-shadow: 0 0 20px var(--hud-data);
        }
        .brand p { font-size: 1.2rem; color: var(--hud-data); margin: 0; letter-spacing: 4px; text-transform: uppercase; }

        /* Dashboard Buttons (Top Right) */
        .sys-controls { pointer-events: auto; display: flex; gap: 15px; position: absolute; top: 40px; right: 40px; }
        .hud-btn {
            display: inline-block; padding: 10px 20px; background: rgba(255, 234, 0, 0.05); color: var(--hud-data);
            text-decoration: none; border: 1px solid rgba(255, 234, 0, 0.3); font-family: 'Orbitron', sans-serif;
            font-weight: 700; font-size: 1rem; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px);
        }
        .hud-btn:hover { background: var(--hud-data); color: #000; box-shadow: 0 0 20px var(--hud-data); }
        .hud-btn-pink { color: var(--hud-pink); border-color: rgba(255, 0, 85, 0.3); background: rgba(255, 0, 85, 0.05); }
        .hud-btn-pink:hover { background: var(--hud-pink); color: #000; box-shadow: 0 0 20px var(--hud-pink); }

        /* Target Info reads card descriptions when a planet is selected (Bottom Left) */
        #target-info {
            background: rgba(1, 2, 6, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-left: 3px solid var(--hud-cyan); padding: 25px;
            width: 400px; position: absolute; bottom: 40px; left: 40px; pointer-events: auto;
            opacity: 0; transform: translateY(20px); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0, 240, 255, 0.05);
        }
        #target-info.active { opacity: 1; transform: translateY(0); }
        #target-info h2 { font-family: 'Orbitron', sans-serif; color: #fff; margin: 0 0 5px 0; font-size: 1.6rem; letter-spacing: 2px; }
        #target-info .subtitle { color: var(--hud-cyan); font-weight: bold; font-size: 0.95rem; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        #target-info p { color: #94a3b8; font-size: 1.15rem; line-height: 1.6; margin: 0 0 20px 0; font-weight: 300; }
        .status-text { color: var(--hud-data); font-family: monospace; font-size: 0.9rem; letter-spacing: 1px; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Crosshair in the center */
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 1px solid rgba(255, 234, 0, 0.2); border-radius: 50%; pointer-events: none; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255, 234, 0, 0.5); }
        .crosshair::before { top: 50%; left: -15px; right: -15px; height: 1px; }
        .crosshair::after { left: 50%; top: -15px; bottom: -15px; width: 1px; }

        /* Decryption subtitlereveal effect */
        #neural-reveal { visibility: hidden; position: absolute; bottom: 10px; left: 45%; font-size: 0.8rem; letter-spacing: 5px; color: rgba(255,255,255,0.3); font-family: monospace;}

    </style>
</head>
<body>

    <canvas id="deep-cosmos"></canvas>

    <canvas id="webgl-engine"></canvas>

    <div id="hud-layer">
        
        <div class="brand">
            <h1>PROJECT SWARM</h1>
            <p>SINGULARITY ENGINE INTERFACE (TYPE II)</p>
        </div>

        <div class="sys-controls">
            <a href="celestial_mapping.html" class="hud-btn">INITIATE SYSTEM VIEW</a>
            <a href="economics_mapping.html" class="hud-btn hud-btn-pink">VON NEUMANN SIMULATOR</a>
        </div>

        <div class="crosshair"></div>

        <div id="target-info">
            <h2 id="target-title">TARGET LOCKED</h2>
            <div class="subtitle" id="target-classification">Awaiting telemetry...</div>
            <p id="target-desc">Initiating descent sequence...</p>
            <div class="status-text">> CLICK NODE TO INITIATE DATA LINK</div>
        </div>
        
        <div id="neural-reveal">> NEURAL LINK ESTABLISHED</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        setTimeout(() => { document.getElementById('neural-reveal').style.visibility = 'visible'; }, 1000);

        // --- GLSL Deep Cosmos Background Shader ---
        const bgCanvas = document.getElementById('deep-cosmos');
        const bgCtx = bgCanvas.getContext('2d');
        let width, height;

        function initBG() {
            width = bgCanvas.width = window.innerWidth;
            height = bgCanvas.height = window.innerHeight;
            drawBackground();
        }

        function drawBackground() {
            bgCtx.clearRect(0, 0, width, height);
            
            // Living, multi-layered cosmic dust (additive blending)
            bgCtx.globalCompositeOperation = 'lighter';
            
            // Layer 1: Deep blue nebula
            const nebula = bgCtx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            nebula.addColorStop(0, '#020510'); nebula.addColorStop(1, '#000000');
            bgCtx.fillStyle = nebula; bgCtx.fillRect(0, 0, width, height);

            // Layer 2: Chaotic star clusters
            for(let i=0; i < 500; i++) {
                bgCtx.fillStyle = Math.random() > 0.9 ? 'rgba(0, 240, 255, 0.2)' : 'rgba(255, 234, 0, 0.2)';
                bgCtx.beginPath();
                bgCtx.arc(Math.random() * width, Math.random() * height, Math.random() * 2, 0, Math.PI * 2);
                bgCtx.fill();
            }

            // Layer 3: Distant deep orange nebula clouds (like our solar system environment)
            const orangeNebula = bgCtx.createRadialGradient(width*0.8, height*0.8, 0, width*0.8, height*0.8, width/2);
            orangeNebula.addColorStop(0, 'rgba(255, 120, 0, 0.05)'); orangeNebula.addColorStop(1, 'rgba(0,0,0,0)');
            bgCtx.fillStyle = orangeNebula; bgCtx.fillRect(0, 0, width, height);
        }

        window.addEventListener('resize', initBG);
        initBG();
    </script>

    <script>
        // --- Setup Scene, Camera, Renderer ---
        const container = document.getElementById('webgl-engine');
        const scene = new THREE.Scene();
        // Add subtle cosmic fog for depth
        scene.fog = new THREE.FogExp2(0x020510, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 40, 100); // Elevated viewing angle

        const renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // --- Orbit Controls ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.maxDistance = 300; controls.minDistance = 30;

        // --- Lighting ---
        scene.add(new THREE.AmbientLight(0x0a1015)); // Deep space ambient light
        const sunLight = new THREE.PointLight(0xffeedd, 3, 500); // Massive central solar light
        scene.add(sunLight);
        
        // Additive lights for the distant Singularity
        const gargantuaLight = new THREE.PointLight(0xffcc00, 2, 200);
        scene.add(gargantuaLight);

        // =========================================================================
        // --- 1. PROCEDURAL PLANET TEXTURE GENERATOR (The Realism Engine) ---
        // =========================================================================
        function generateHighDefPlanet(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (type === 'volcanic') {
                ctx.fillStyle = '#110502'; ctx.fillRect(0, 0, 1024, 512);
                for(let i=0; i<5000; i++) {
                    ctx.fillStyle = Math.random() > 0.9 ? '#ff3300' : '#1a0d05';
                    ctx.globalAlpha = Math.random() * 0.8;
                    ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*5, 0, Math.PI*2); ctx.fill();
                }
            } else if (type === 'gas_bands') {
                const gradient = ctx.createLinearGradient(0, 0, 0, 512);
                gradient.addColorStop(0, '#584433'); gradient.addColorStop(0.3, '#ffccaa'); 
                gradient.addColorStop(0.6, '#d6b280'); gradient.addColorStop(1, '#8c7356');
                ctx.fillStyle = gradient; ctx.fillRect(0, 0, 1024, 512);
                for(let i=0; i<100; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#fff' : '#444'; ctx.globalAlpha = Math.random() * 0.05;
                    ctx.fillRect(0, Math.random()*512, 1024, Math.random()*10);
                }
            } else if (type === 'oceanic') {
                // Procedural Earth-like continents/water
                ctx.fillStyle = '#004488'; ctx.fillRect(0, 0, 1024, 512);
                ctx.fillStyle = '#115522'; 
                for(let i=0; i<1000; i++) {
                    ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*15, 0, Math.PI*2); ctx.fill();
                }
            } else if (type === 'industrial') {
                ctx.fillStyle = '#22252a'; ctx.fillRect(0, 0, 1024, 512);
                ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 1;
                for(let i=0; i<20; i++) {
                    ctx.beginPath(); ctx.moveTo(Math.random()*1024, Math.random()*512);
                    for(let j=0; j<5; j++) { ctx.lineTo(Math.random()*1024, Math.random()*512); }
                    ctx.stroke(); // Glowing cybernetic lines
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- 2. THE DISTANT SUPERMASSIVE BLACK HOLE (Gargantua Style) ---
        const horizonGeo = new THREE.SphereGeometry(15, 64, 64);
        const horizonMat = new THREE.MeshBasicMaterial({ color: 0x000000 }); // Event Horizon
        const gargantua = new THREE.Mesh(horizonGeo, horizonMat);
        gargantua.position.set(-200, 0, -200); // Extreme distance
        scene.add(gargantua);

        // Additive Accretion Disk (Interstellar aesthetic)
        const diskGeo = new THREE.TorusGeometry(20, 3, 2, 128);
        const diskTex = generateHighDefPlanet('gas_bands'); // Re-use texture for ring patterns
        const diskMat = new THREE.MeshBasicMaterial({ 
            map: diskTex, color: 0xffaa00, transparent: true, opacity: 0.9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending 
        });
        const accretionDisk = new THREE.Mesh(diskGeo, diskMat);
        accretionDisk.position.copy(gargantua.position);
        accretionDisk.rotation.x = Math.PI / 2 + 0.1; // Warp perspective
        accretionDisk.rotation.y = 0.1;
        scene.add(accretionDisk);

        // --- 3. THE DISTANT SPHERE (The Central Star) ---
        const starGeo = new THREE.SphereGeometry(12, 64, 64);
        const starTex = generateHighDefPlanet('gas_bands'); // Use detailed gas for complex solar surface
        const starMat = new THREE.MeshBasicMaterial({ map: starTex, color: 0xffaa00 });
        const centralStar = new THREE.Mesh(starGeo, starMat);
        scene.add(centralStar);

        // Additive Corona Glow
        const coronaGeo = new THREE.SphereGeometry(12.5, 64, 64);
        const coronaMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.2, blending: THREE.AdditiveBlending });
        scene.add(new THREE.Mesh(coronaGeo, coronaMat));

        // The Swarm (Particle Belt orbiting the central star)
        const swarmCount = 3000;
        const swarmGeo = new THREE.BufferGeometry();
        const swarmPos = new Float32Array(swarmCount * 3);
        
        for(let i=0; i < swarmCount * 3; i+=3) {
            const r = 18 + Math.random() * 60;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            swarmPos[i] = r * Math.sin(phi) * Math.cos(theta);
            swarmPos[i+1] = r * Math.sin(phi) * Math.sin(theta) * 0.1; // Flat Belt
            swarmPos[i+2] = r * Math.cos(phi);
        }
        
        swarmGeo.setAttribute('position', new THREE.BufferAttribute(swarmPos, 3));
        const swarmMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.1, transparent: true, opacity: 0.6 });
        const theSwarm = new THREE.Points(swarmGeo, swarmMat);
        scene.add(theSwarm);

        // --- 4. THE 4 PLANETARY NODES (Detailed Worlds) ---
        const nodes = [];
        const nodeData = [
            // Stage 1 (Chaos)
            { id: 1, type: 'volcanic', title: "STOCHASTIC RESONANCE", sub: "STAGE 1: SEN_SWARM", desc: "Violent volcanic world. Simulates utilizing chaotic background noise of solar wind to amplify hidden signals.", url: "stochastic_resonance.html", distance: 30, speed: 0.003, size: 2, glow: 0xff3300 },
            // Stage 2 (Routing)
            { id: 2, type: 'gas_bands', title: "INGESTION ROUTER", sub: "STAGE 2: SPHERE_ML", desc: "Layered gas giant. Represents Fast Fourier Transform (FFT) algorithms sorting chaotic firehoses into frequency arrays.", url: "06_fft_router.html", distance: 45, speed: 0.002, size: 3, glow: 0xffaa00 },
            // Stage 3 (Memory)
            { id: 3, type: 'oceanic', title: "INVERSE SCATTERING", sub: "STAGE 3: MEMORY ENGINE", desc: "Terraformed Oceanic World. Machine Learning Core reconstructs perfect 3D geometric memory from scattered points.", url: "inverse_scattering.html", distance: 65, speed: 0.0015, size: 2.5, glow: 0x00f3ff },
            // Stage 4 (Forge)
            { id: 4, type: 'industrial', title: "VON NEUMANN ASSEMBLY", sub: "STAGE 4: PHONONIC FORGE", desc: "Dense cybernetic planet. Acoustic resonance waves crystallizing plasma into highly evolved Smart Rocks.", url: "phononic_forge.html", distance: 85, speed: 0.001, size: 2, glow: 0x00f3ff }
        ];

        nodeData.forEach((data, index) => {
            // Core Planet Mesh with High-Def Texture/Bump
            const geo = new THREE.SphereGeometry(data.size, 64, 64);
            const tex = generateHighDefPlanet(data.type);
            const mat = new THREE.MeshStandardMaterial({ map: tex, bumpMap: tex, bumpScale: 0.1, roughness: 0.7, metalness: 0.1 });
            const mesh = new THREE.Mesh(geo, mat);

            // Add separate transparent cloud layer for Earth-like planet (depth)
            if (data.type === 'oceanic') {
                const cloudGeo = new THREE.SphereGeometry(data.size + 0.05, 64, 64);
                const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending });
                const clouds = new THREE.Mesh(cloudGeo, cloudMat);
                mesh.add(clouds);
                mesh.clouds = clouds;
            }

            // High-intensity additive atmosphere glow
            const atmoGeo = new THREE.SphereGeometry(data.size * 1.15, 32, 32);
            const atmoMat = new THREE.MeshBasicMaterial({ color: data.glow, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending });
            mesh.add(new THREE.Mesh(atmoGeo, atmoMat));
            
            // Orbital mathematics
            const angle = (index / nodeData.length) * Math.PI * 2;
            mesh.position.x = Math.cos(angle) * data.distance;
            mesh.position.z = Math.sin(angle) * data.distance;
            
            mesh.userData = data; mesh.userData.angle = angle; 

            // Subtly colored orbital ring line
            const pathGeo = new THREE.RingGeometry(data.distance - 0.1, data.distance + 0.1, 128);
            const pathMat = new THREE.MeshBasicMaterial({ color: data.glow, side: THREE.DoubleSide, transparent: true, opacity: 0.05 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = Math.PI / 2;
            scene.add(path);

            scene.add(mesh);
            nodes.push(mesh);
        });

        // =========================================================================
        // --- 5. INTERACTION LOGIC (RAYCASTER) ---
        // =========================================================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        // HUD UI Elements
        const targetInfo = document.getElementById('target-info');
        const targetTitle = document.getElementById('target-title');
        const targetClassification = document.getElementById('target-classification');
        const targetDesc = document.getElementById('target-desc');
        
        let hoveredNode = null;

        // Trace mouse coordinate onto 3D scene
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // NATIVE navigation to launch simulator
        window.addEventListener('click', () => {
            if (hoveredNode && hoveredNode.userData.url) {
                // Navigate in the CURRENT window. Native back button supported.
                window.location.href = hoveredNode.userData.url;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // =========================================================================
        // --- 6. ANIMATION & PHYSICS LOOP ---
        // =========================================================================
        function animate() {
            requestAnimationFrame(animate);

            // Black Hole Accretion (fast rotation at core)
            accretionDisk.rotation.y += 0.01;

            // Swarm Rotation (slow, chaotic)
            theSwarm.rotation.y += 0.0005;

            // Planetesimal Orbit & Spin
            nodes.forEach(node => {
                node.userData.angle += node.userData.speed;
                node.position.x = Math.cos(node.userData.angle) * node.userData.distance;
                node.position.z = Math.sin(node.userData.angle) * node.userData.distance;
                node.rotation.y += 0.005; 
                // Separate cloud rotation (depth)
                if (node.clouds) node.clouds.rotation.y += 0.007;
            });

            // Raycasting for UI interaction
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);

            if (intersects.length > 0) {
                if (hoveredNode !== intersects[0].object) {
                    hoveredNode = intersects[0].object;
                    // Update HUD with original Phase Card descriptions
                    targetTitle.innerText = hoveredNode.userData.title;
                    targetClassification.innerText = hoveredNode.userData.sub;
                    targetDesc.innerText = hoveredNode.userData.desc;
                    targetInfo.style.borderColor = '#' + hoveredNode.userData.glow.toString(16).padStart(6, '0');
                    targetInfo.classList.add('active');
                    document.body.style.cursor = 'pointer';
                }
            } else {
                if (hoveredNode) {
                    hoveredNode = null;
                    targetInfo.classList.remove('active');
                    document.body.style.cursor = 'default';
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- INITIATE ENGINE ---
        animate();
    </script>
</body>
</html>
