<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Swarm | The Antifragile Ecosystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #020617;
            --bg-panel: rgba(15, 23, 42, 0.6);
            --neon-blue: #0ea5e9;
            --neon-pink: #ec4899;
            --neon-green: #10b981;
            --text-main: #cbd5e1;
            --text-header: #f8fafc;
            --border-dim: rgba(51, 65, 85, 0.5);
        }

        body {
            background: radial-gradient(circle at top, #0f172a 0%, var(--bg-void) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-header);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .hero {
            padding: 100px 20px 80px;
            text-align: center;
            border-bottom: 1px solid var(--border-dim);
            background: linear-gradient(180deg, rgba(2,6,23,0) 0%, var(--bg-void) 100%);
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(14, 165, 233, 0.4);
        }

        .hero p {
            font-size: 1.25rem;
            max-width: 800px;
            margin: 0 auto;
            color: #94a3b8;
            font-weight: 400;
        }

        .container {
            max-width: 1100px;
            margin: -40px auto 60px auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .story-section {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-dim);
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }

        .story-section:hover {
            border-color: rgba(14, 165, 233, 0.3);
        }

        .highlight-green { color: var(--neon-green); text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .highlight-blue { color: var(--neon-blue); text-shadow: 0 0 10px rgba(14, 165, 233, 0.3); }
        .highlight-pink { color: var(--neon-pink); font-weight: bold; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border-dim);
            border-radius: 12px;
            padding: 30px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        /* Subtle glowing top border for cards */
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            opacity: 0.3; transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(14, 165, 233, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), 0 0 20px rgba(14, 165, 233, 0.1);
        }

        .card:hover::before { opacity: 1; }
        .card h3 { margin-top: 0; color: #e2e8f0; font-size: 1.3rem; }
        .card p { color: #94a3b8; font-size: 0.95rem; line-height: 1.7; }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn-green { background: linear-gradient(135deg, #059669 0%, #10b981 100%); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
        .btn-green:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        .btn-blue { background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%); box-shadow: 0 4px 15px rgba(14, 165, 233, 0.2); }
        .btn-blue:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4); }

        .btn-pink { background: linear-gradient(135deg, #db2777 0%, #ec4899 100%); box-shadow: 0 4px 15px rgba(236, 72, 153, 0.2); }
        .btn-pink:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4); }

        .dashboard-panel {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(2, 6, 23, 0.9) 100%);
            border: 1px solid rgba(14, 165, 233, 0.3);
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.1) inset;
        }

        .dashboard-panel h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>PROJECT SWARM</h1>
        <p>A decentralized, chaos-driven cosmic data pipeline utilizing Piezo-phononic metamaterials.</p>
    </div>

    <div class="container">
        
        <div class="story-section" style="border-top: 3px solid var(--neon-green);">
            <h2 class="highlight-green">System Architecture (The Software Level)</h2>
            <p>Beneath
