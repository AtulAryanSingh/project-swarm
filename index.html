<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Swarm | TYPE II SINGULARITY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: 'Rajdhani', sans-serif; color: #fff; user-select: none; }
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #010205; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease;
        }
        .loader-text { font-family: 'Orbitron', sans-serif; color: #ffaa00; font-size: 1.5rem; letter-spacing: 5px; animation: pulse 1.5s infinite; }
        .loader-sub { color: #00f3ff; font-family: monospace; margin-top: 10px; font-size: 0.9rem; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* HUD UI */
        #hud-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; padding: 40px; box-sizing: border-box;
            background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.8) 100%);
        }

        .top-nav { display: flex; justify-content: space-between; width: 100%; align-items: flex-start; }
        .brand h1 { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; margin: 0 0 5px 0; letter-spacing: 8px; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .brand p { font-size: 1rem; color: #ffaa00; margin: 0; letter-spacing: 4px; text-transform: uppercase; }

        .sys-controls { pointer-events: auto; display: flex; gap: 15px; }
        .cyber-btn {
            padding: 10px 20px; background: rgba(0,0,0,0.5); border: 1px solid #555; color: #fff;
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 0.9rem; letter-spacing: 2px;
            text-transform: uppercase; text-decoration: none; backdrop-filter: blur(5px); transition: 0.3s; cursor: pointer;
        }
        .cyber-btn:hover { border-color: #ffaa00; color: #ffaa00; box-shadow: 0 0 15px rgba(255, 170, 0, 0.3); }

        /* Targeting Info Panel */
        #target-info {
            position: absolute; bottom: 40px; left: 40px; width: 400px; padding: 25px;
            background: rgba(2, 5, 10, 0.85); backdrop-filter: blur(10px); border-left: 3px solid #00f3ff;
            opacity: 0; transform: translateY(20px); transition: all 0.4s ease; pointer-events: auto;
        }
        #target-info.active { opacity: 1; transform: translateY(0); }
        #target-info h2 { font-family: 'Orbitron', sans-serif; color: #fff; margin: 0 0 5px 0; font-size: 1.4rem; letter-spacing: 2px; }
        #target-info .subtitle { color: #00f3ff; font-weight: bold; font-size: 0.85rem; margin-bottom: 12px; letter-spacing: 2px; }
        #target-info p { color: #a0aec0; font-size: 1.05rem; line-height: 1.6; margin: 0 0 15px 0; }
        .status-text { color: #ffaa00; font-family: monospace; font-size: 0.85rem; animation: pulse 1.5s infinite; }

        .reticle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: none; transition: 0.3s; }
        .reticle::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #fff; border-radius: 50%; }

        .hint { position: absolute; bottom: 40px; right: 40px; text-align: right; color: rgba(255,255,255,0.3); font-family: monospace; font-size: 0.8rem; line-height: 1.8; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-text">SYNTHESIZING UNIVERSE</div>
        <div class="loader-sub">GENERATING PROCEDURAL FRACTAL TERRAINS...</div>
    </div>

    <div id="webgl-canvas"></div>

    <div id="hud-layer">
        <div class="top-nav">
            <div class="brand">
                <h1>PROJECT SWARM</h1>
                <p>EVENT HORIZON TERMINAL</p>
            </div>
            <div class="sys-controls">
                <a href="celestial_mapping.html" class="cyber-btn">SYSTEM_MAP</a>
                <a href="economics_mapping.html" class="cyber-btn" style="border-color: #ff0055; color: #ff0055;">THE_FORGE</a>
            </div>
        </div>

        <div class="reticle" id="center-reticle"></div>

        <div id="target-info">
            <h2 id="dp-title">MODULE</h2>
            <div class="subtitle" id="dp-sub">CLASSIFICATION</div>
            <p id="dp-desc">Telemetry data.</p>
            <div class="status-text">> CLICK TO INITIATE DESCENT</div>
        </div>

        <div class="hint">
            [ DRAG TO ORBIT SINGULARITY ]<br>
            [ SCROLL TO ZOOM ]<br>
            [ SELECT PLANETARY NODE ]
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // =========================================================================
        // 1. ADVANCED MATHEMATICAL TEXTURE ENGINE (Replaces external images)
        // =========================================================================
        function generateHighDefTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 1024; // Ultra HD resolution
            const ctx = canvas.getContext('2d');

            // Advanced Fractional Brownian Motion (fBm) noise approximation
            function noise(x, y) { return Math.sin(x*0.05)*Math.cos(y*0.05) + Math.sin(x*0.1)*0.5 + Math.cos(y*0.1)*0.5; }

            if (type === 'skydome') {
                const grad = ctx.createLinearGradient(0, 0, 0, 1024);
                grad.addColorStop(0, '#010205'); grad.addColorStop(0.5, '#050a14'); grad.addColorStop(1, '#010205');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 2048, 1024);
                
                // Milky Way Dust
                ctx.globalCompositeOperation = 'lighter';
                for(let i=0; i<100; i++) {
                    const cx = Math.random()*2048, cy = Math.random()*1024, cr = 100+Math.random()*300;
                    const rgrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr);
                    rgrad.addColorStop(0, 'rgba(50, 100, 255, 0.03)'); rgrad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = rgrad; ctx.fillRect(cx-cr, cy-cr, cr*2, cr*2);
                }
                // 20,000 Stars
                for(let i=0; i<20000; i++) {
                    ctx.fillStyle = Math.random()>0.8 ? '#aaccff' : '#ffffff';
                    ctx.globalAlpha = Math.random();
                    ctx.fillRect(Math.random()*2048, Math.random()*1024, Math.random()*1.5, Math.random()*1.5);
                }
            }
            else if (type === 'oceanic') {
                ctx.fillStyle = '#021526'; ctx.fillRect(0, 0, 2048, 1024); // Deep Ocean
                ctx.fillStyle = '#1b3b22'; // Landmass
                for(let x=0; x<2048; x+=4) {
                    for(let y=0; y<1024; y+=4) {
                        let n = noise(x, y) + noise(x*2.5, y*2.5)*0.5;
                        if(n > 0.4) {
                            ctx.fillStyle = n > 0.8 ? '#4a3b2c' : '#1b3b22'; // Mountains vs Jungle
                            ctx.fillRect(x, y, 4, 4);
                        }
                    }
                }
            }
            else if (type === 'clouds') {
                ctx.clearRect(0,0,2048,1024);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for(let x=0; x<2048; x+=8) {
                    for(let y=0; y<1024; y+=8) {
                        let n = noise(x*1.5, y*1.5);
                        if(n > 0.6) { ctx.beginPath(); ctx.arc(x, y, (n-0.6)*20, 0, Math.PI*2); ctx.fill(); }
                    }
                }
            }
            else if (type === 'gas_giant') {
                for(let y=0; y<1024; y++) {
                    let v = Math.sin(y * 0.02) + Math.sin(y * 0.08) * 0.4;
                    let r = 180 + v * 40 + Math.random()*10;
                    let g = 130 + v * 30 + Math.random()*10;
                    let b = 80 + v * 20;
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(0, y, 2048, 1);
                }
                // Giant Storm
                const grad = ctx.createRadialGradient(800, 600, 0, 800, 600, 150);
                grad.addColorStop(0, 'rgba(150, 40, 10, 0.9)'); grad.addColorStop(1, 'rgba(150, 40, 10, 0)');
                ctx.fillStyle = grad; ctx.fillRect(0,0,2048,1024);
            }
            else if (type === 'volcanic') {
                ctx.fillStyle = '#110502'; ctx.fillRect(0, 0, 2048, 1024); // Obsidian
                ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 3;
                for(let i=0; i<150; i++) { // Lava rivers
                    ctx.beginPath(); ctx.moveTo(Math.random()*2048, Math.random()*1024);
                    for(let j=0; j<15; j++) { ctx.lineTo(Math.random()*2048, Math.random()*1024); }
                    ctx.stroke();
                }
                for(let i=0; i<5000; i++) { // Craters
                    ctx.fillStyle = '#0a0301'; ctx.beginPath(); ctx.arc(Math.random()*2048, Math.random()*1024, Math.random()*8, 0, Math.PI*2); ctx.fill();
                }
            }
            else if (type === 'forge') {
                ctx.fillStyle = '#1a1c23'; ctx.fillRect(0, 0, 2048, 1024); // Dark Metal
                ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 1;
                for(let x=0; x<2048; x+=64) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,1024); ctx.stroke(); }
                for(let y=0; y<1024; y+=64) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(2048,y); ctx.stroke(); }
                for(let i=0; i<5000; i++) {
                    ctx.fillStyle = Math.random()>0.8?'#00f3ff':'#333'; ctx.fillRect(Math.random()*2048, Math.random()*1024, 4, 4);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        // =========================================================================
        // 2. SCENE INITIALIZATION & POST-PROCESSING ENGINE
        // =========================================================================
        const container = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
        camera.position.set(0, 80, 250);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        // Tone mapping makes bright lights (accretion disk) look cinematic
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; 
        controls.maxDistance = 800; controls.minDistance = 50;

        // --- Lighting ---
        scene.add(new THREE.AmbientLight(0x050a10, 1.5));
        const singularityLight = new THREE.PointLight(0xffddaa, 5, 2000); // Massive light from the accretion disk
        scene.add(singularityLight);

        // =========================================================================
        // 3. ASYNC GENERATION (To prevent freezing while rendering textures)
        // =========================================================================
        setTimeout(() => {
            
            // 1. Skydome Background
            const skyGeo = new THREE.SphereGeometry(2000, 64, 64);
            const skyMat = new THREE.MeshBasicMaterial({ map: generateHighDefTexture('skydome'), side: THREE.BackSide, fog: false });
            scene.add(new THREE.Mesh(skyGeo, skyMat));

            // 2. THE BLACK HOLE (Gargantua)
            const bhGroup = new THREE.Group();
            scene.add(bhGroup);

            // The Event Horizon (Pitch Black Core)
            const ehGeo = new THREE.SphereGeometry(20, 64, 64);
            const ehMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eventHorizon = new THREE.Mesh(ehGeo, ehMat);
            bhGroup.add(eventHorizon);

            // The Photon Sphere (Thin glowing ring right on the edge)
            const photonGeo = new THREE.SphereGeometry(20.5, 64, 64);
            const photonMat = new THREE.MeshBasicMaterial({ color: 0xffffee, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, side: THREE.BackSide });
            bhGroup.add(new THREE.Mesh(photonGeo, photonMat));

            // The Accretion Disk (100,000 volumetric particles)
            const diskCount = 100000;
            const diskGeo = new THREE.BufferGeometry();
            const diskPos = new Float32Array(diskCount * 3);
            const diskCol = new Float32Array(diskCount * 3);
            
            const cInner = new THREE.Color(0xffffff); // White hot
            const cMid = new THREE.Color(0xffaa00);   // Golden
            const cOuter = new THREE.Color(0xff3300); // Deep red

            for(let i=0; i<diskCount; i++) {
                // Skew distribution to pack densely near the event horizon
                const radius = 22 + Math.pow(Math.random(), 3) * 80;
                const angle = Math.random() * Math.PI * 2;
                
                // Warp the y-axis to simulate gravitational lensing (bending light)
                const warp = Math.sin(angle * 2) * (50 / radius);
                const y = (Math.random() - 0.5) * 2 + warp;

                diskPos[i*3] = Math.cos(angle) * radius;
                diskPos[i*3+1] = y;
                diskPos[i*3+2] = Math.sin(angle) * radius;

                // Color gradient based on heat/distance
                let ratio = (radius - 22) / 80;
                let c = cInner.clone().lerp(cMid, ratio * 3);
                if(ratio > 0.33) c = cMid.clone().lerp(cOuter, (ratio - 0.33) * 1.5);

                diskCol[i*3] = c.r; diskCol[i*3+1] = c.g; diskCol[i*3+2] = c.b;
            }
            diskGeo.setAttribute('position', new THREE.BufferAttribute(diskPos, 3));
            diskGeo.setAttribute('color', new THREE.BufferAttribute(diskCol, 3));
            const diskMat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.6 });
            const accretionDisk = new THREE.Points(diskGeo, diskMat);
            // Tilt the disk for the cinematic Interstellar angle
            accretionDisk.rotation.x = Math.PI * 0.1;
            accretionDisk.rotation.z = Math.PI * 0.05;
            bhGroup.add(accretionDisk);

            // 3. THE PLANETARY SYSTEM
            const planets = [];
            const planetData = [
                { type: 'volcanic', title: "STOCHASTIC RESONANCE", sub: "STAGE 1", desc: "Violent volcanic world. Utilizing chaotic solar wind background noise to amplify faint data.", url: "stochastic_resonance.html", distance: 70, speed: 0.004, size: 3.5, glow: 0xff3300 },
                { type: 'gas_giant', title: "INGESTION ROUTER", sub: "STAGE 2", desc: "Massive gas giant. Fast Fourier Transform (FFT) algorithms sorting chaotic firehoses into frequency arrays.", url: "06_fft_router.html", distance: 110, speed: 0.0025, size: 6, glow: 0xffaa00, hasRings: true },
                { type: 'oceanic', title: "INVERSE SCATTERING", sub: "STAGE 3", desc: "Oceanic World. Machine Learning Core reconstructs perfect 3D geometric memory from shattered data.", url: "inverse_scattering.html", distance: 160, speed: 0.0018, size: 4.5, glow: 0x00f3ff, hasClouds: true },
                { type: 'forge', title: "PHONONIC FORGE", sub: "STAGE 4", desc: "Dense cybernetic planet. Acoustic resonance waves crystallizing plasma into highly evolved Smart Rocks.", url: "phononic_forge.html", distance: 210, speed: 0.0012, size: 3, glow: 0x00f3ff }
            ];

            planetData.forEach((data, index) => {
                // High Def Base Mesh
                const geo = new THREE.SphereGeometry(data.size, 64, 64);
                const tex = generateHighDefTexture(data.type);
                const mat = new THREE.MeshStandardMaterial({ map: tex, bumpMap: tex, bumpScale: 0.2, roughness: 0.7, metalness: data.type==='forge'?0.8:0.1 });
                const mesh = new THREE.Mesh(geo, mat);

                // Earth-like Clouds
                if (data.hasClouds) {
                    const cGeo = new THREE.SphereGeometry(data.size * 1.02, 64, 64);
                    const cMat = new THREE.MeshStandardMaterial({ map: generateHighDefTexture('clouds'), transparent: true, opacity: 0.9, depthWrite: false });
                    mesh.clouds = new THREE.Mesh(cGeo, cMat);
                    mesh.add(mesh.clouds);
                }

                // Saturn-like Rings for Gas Giant
                if (data.hasRings) {
                    const rGeo = new THREE.RingGeometry(data.size * 1.5, data.size * 2.5, 128);
                    const rTex = generateHighDefTexture('gas_giant'); // Reuse gas bands for ring lines
                    const rMat = new THREE.MeshStandardMaterial({ map: rTex, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                    const ring = new THREE.Mesh(rGeo, rMat);
                    ring.rotation.x = Math.PI / 2 + 0.2;
                    mesh.add(ring);
                }

                // Additive Atmosphere Glow
                const aGeo = new THREE.SphereGeometry(data.size * 1.15, 32, 32);
                const aMat = new THREE.MeshBasicMaterial({ color: data.glow, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
                mesh.add(new THREE.Mesh(aGeo, aMat));

                // Orbit Math
                const angle = (index / planetData.length) * Math.PI * 2;
                mesh.position.x = Math.cos(angle) * data.distance;
                mesh.position.z = Math.sin(angle) * data.distance;
                mesh.userData = data; mesh.userData.angle = angle;

                // Orbit Line
                const pGeo = new THREE.RingGeometry(data.distance - 0.2, data.distance + 0.2, 128);
                const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.05 });
                const path = new THREE.Mesh(pGeo, pMat);
                path.rotation.x = Math.PI / 2;
                scene.add(path);

                scene.add(mesh);
                planets.push(mesh);
            });

            // 4. RAYCASTING & UI LOGIC
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            const dpTitle = document.getElementById('dp-title');
            const dpSub = document.getElementById('dp-sub');
            const dpDesc = document.getElementById('dp-desc');
            const dataPanel = document.getElementById('target-info');
            const reticle = document.getElementById('center-reticle');
            let hoveredNode = null;

            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            window.addEventListener('click', () => {
                if (hoveredNode && hoveredNode.userData.url) window.location.href = hoveredNode.userData.url;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Hide Loading Screen
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 1000);

            // 5. PHYSICS LOOP
            function animate() {
                requestAnimationFrame(animate);

                // Fast rotation for the inner accretion disk
                accretionDisk.rotation.y -= 0.01;

                // Planet orbits
                planets.forEach(planet => {
                    planet.userData.angle += planet.userData.speed;
                    planet.position.x = Math.cos(planet.userData.angle) * planet.userData.distance;
                    planet.position.z = Math.sin(planet.userData.angle) * planet.userData.distance;
                    planet.rotation.y += 0.005; 
                    if (planet.clouds) planet.clouds.rotation.y += 0.007;
                });

                // UI Interactivity
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(planets);

                if (intersects.length > 0) {
                    if (hoveredNode !== intersects[0].object) {
                        hoveredNode = intersects[0].object;
                        dpTitle.innerText = hoveredNode.userData.title;
                        dpSub.innerText = hoveredNode.userData.sub;
                        dpDesc.innerText = hoveredNode.userData.desc;
                        dataPanel.style.borderLeftColor = '#' + hoveredNode.userData.glow.toString(16).padStart(6, '0');
                        reticle.style.borderColor = '#' + hoveredNode.userData.glow.toString(16).padStart(6, '0');
                        reticle.style.transform = 'translate(-50%, -50%) scale(1.5)';
                        dataPanel.classList.add('active');
                        document.body.style.cursor = 'pointer';
                    }
                } else {
                    if (hoveredNode) {
                        hoveredNode = null;
                        dataPanel.classList.remove('active');
                        reticle.style.borderColor = 'rgba(255,255,255,0.2)';
                        reticle.style.transform = 'translate(-50%, -50%) scale(1)';
                        document.body.style.cursor = 'default';
                    }
                }

                controls.update();
                renderer.render(scene, camera);
            }
            animate();

        }, 100); // Small delay to allow loading screen to render
    </script>
</body>
</html>
