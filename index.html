<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Swarm | TYPE II COMMAND TERMINAL</title>

    <style>
        :root {
            --bg-void: #030508;
            --hud-cyan: #00f0ff;
            --hud-pink: #ff003c;
            --hud-green: #00ff66;
            --text-data: #8da1b9;
            --panel-bg: rgba(3, 10, 20, 0.75);
        }

        /* The Grid Background */
        body {
            background-color: var(--bg-void);
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-data);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0;
        }

        /* Top Header Area */
        .hero {
            padding: 80px 20px 60px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            background: radial-gradient(circle at center, rgba(0, 240, 255, 0.05) 0%, transparent 70%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .hero h1 {
            font-size: 4.5rem;
            color: #ffffff;
            margin-bottom: 5px;
            letter-spacing: 8px;
            text-shadow: 0 0 20px var(--hud-cyan), 0 0 40px var(--hud-cyan);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--hud-cyan);
            max-width: 800px;
            margin: 0 auto;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        /* HUD Panels */
        .panel {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 35px;
            margin-bottom: 40px;
            position: relative;
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* Sci-Fi Corner Accents */
        .panel::before, .panel::after {
            content: ''; position: absolute; width: 15px; height: 15px;
        }
        .panel::before { top: -1px; left: -1px; border-top: 2px solid var(--hud-cyan); border-left: 2px solid var(--hud-cyan); }
        .panel::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--hud-cyan); border-right: 2px solid var(--hud-cyan); }

        .panel-green { border-color: rgba(0, 255, 102, 0.3); }
        .panel-green::before { border-color: var(--hud-green); }
        .panel-green::after { border-color: var(--hud-green); }

        .panel h2 { font-size: 2rem; color: #ffffff; }
        .panel h2.cyan { text-shadow: 0 0 10px var(--hud-cyan); }
        .panel h2.green { text-shadow: 0 0 10px var(--hud-green); }
        
        .highlight { color: var(--hud-pink); font-weight: bold; text-shadow: 0 0 8px var(--hud-pink); }
        .data-list { list-style: none; padding: 0; }
        .data-list li { margin-bottom: 15px; padding-left: 20px; border-left: 2px solid var(--hud-cyan); }
        .data-list strong { color: #ffffff; font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; letter-spacing: 1px;}

        /* Grid for Stages */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
        }

        .card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 30px;
            position: relative;
            transition: all 0.2s ease;
        }
