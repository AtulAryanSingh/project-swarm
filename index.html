<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Swarm | 3D STELLAR TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent scrolling, the 3D canvas fills the screen */
            background-color: #020205;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }

        /* The 3D Canvas */
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 2D HUD Overlay (Pointer events none so you can click the 3D objects behind it) */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Top Left Title */
        .title-block h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            margin: 0 0 10px 0;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 20px #00f3ff;
        }
        .title-block p {
            font-size: 1.2rem;
            color: #00f3ff;
            margin: 0;
            letter-spacing: 2px;
        }

        /* Top Right Dashboard Links (Re-enable pointer events for buttons) */
        .dashboard-links {
            position: absolute;
            top: 40px;
            right: 40px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-end;
        }

        .hud-btn {
            padding: 10px 20px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            cursor: pointer;
        }

        .hud-btn:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px #00f3ff;
        }

        .hud-btn-pink { border-color: #ff0055; color: #ff0055; background: rgba(255, 0, 85, 0.1); }
        .hud-btn-pink:hover { background: #ff0055; color: #000; box-shadow: 0 0 20px #ff0055; }

        /* The Targeting Info Panel (Bottom Left) */
        #target-info {
            background: rgba(5, 5, 10, 0.8);
            border-left: 3px solid #ff0055;
            padding: 25px;
            width: 400px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        #target-info.active {
            opacity: 1;
            transform: translateY(0);
        }

        #target-info h2 {
            font-family: 'Orbitron', sans-serif;
            color: #ff0055;
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(255, 0, 85, 0.3);
            padding-bottom: 10px;
        }

        #target-info p {
            color: #a0aec0;
            font-size: 1.1rem;
            line-height: 1.5;
            margin: 0 0 15px 0;
        }

        .status-text {
            color: #00ff66;
            font-family: monospace;
            font-size: 0.9rem;
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Crosshair in the center */
        .crosshair {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }
        .crosshair::before, .crosshair::after {
            content: ''; position: absolute; background: rgba(0, 243, 255, 0.4);
        }
        .crosshair::before { top: 50%; left: -10px; right: -10px; height: 1px; }
        .crosshair::after { left: 50%; top: -10px; bottom: -10px; width: 1px; }

    </style>
</head>
<body>

    <div id="webgl-canvas"></div>

    <div id="hud-layer">
        <div class="title-block">
            <h1>PROJECT SWARM</h1>
            <p>STELLAR ARCHITECTURE VISUALIZER</p>
        </div>

        <div class="dashboard-links">
            <a href="celestial_mapping.html" class="hud-btn">INNER SYSTEM VIEW</a>
            <a href="economics_mapping.html" class="hud-btn hud-btn-pink">VON NEUMANN SIMULATOR</a>
            <div style="color: rgba(255,255,255,0.5); font-size: 0.8rem; margin-top: 10px; text-align: right; font-family: monospace;">
                [ LEFT CLICK + DRAG TO ROTATE ]<br>
                [ SCROLL TO ZOOM ]<br>
                [ CLICK NODES TO INITIATE ]
            </div>
        </div>

        <div class="crosshair"></div>

        <div id="target-info">
            <h2 id="target-title">TARGET LOCKED</h2>
            <p id="target-desc">Awaiting telemetry...</p>
            <div class="status-text">> CLICK NODE TO INITIATE SEQUENCE</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- SETUP SCENE, CAMERA, RENDERER ---
        const container = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.005); // Deep space fade

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 30, 80); // Elevated viewing angle

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // --- CONTROLS ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 200;
        controls.minDistance = 20;

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        // A massive blue light coming from the central star
        const starLight = new THREE.PointLight(0x00f3ff, 2, 200);
        scene.add(starLight);

        // --- CONSTRUCT THE SYSTEM ---
        
        // 1. Central Star (The Distant Sphere)
        const starGeo = new THREE.SphereGeometry(8, 64, 64);
        const starMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true }); 
        const centralStar = new THREE.Mesh(starGeo, starMat);
        scene.add(centralStar);

        // Adding an inner solid core to the star
        const coreGeo = new THREE.SphereGeometry(7.5, 32, 32);
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x0088ff, emissive: 0x0044aa, roughness: 0.2 });
        const starCore = new THREE.Mesh(coreGeo, coreMat);
        scene.add(starCore);

        // 2. The Swarm (Particle System)
        const swarmCount = 3000;
        const swarmGeo = new THREE.BufferGeometry();
        const swarmPos = new Float32Array(swarmCount * 3);
        
        for(let i=0; i < swarmCount * 3; i+=3) {
            // Create a chaotic spherical belt around the star
            const r = 15 + Math.random() * 40;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            swarmPos[i] = r * Math.sin(phi) * Math.cos(theta);
            swarmPos[i+1] = r * Math.sin(phi) * Math.sin(theta) * 0.3; // Flatten the Swarm into a disk
            swarmPos[i+2] = r * Math.cos(phi);
        }
        
        swarmGeo.setAttribute('position', new THREE.BufferAttribute(swarmPos, 3));
        const swarmMat = new THREE.PointsMaterial({ color: 0xff0055, size: 0.3, transparent: true, opacity: 0.6 });
        const swarmSystem = new THREE.Points(swarmGeo, swarmMat);
        scene.add(swarmSystem);

        // 3. The Planetary Nodes (The Four Stages)
        const nodes = [];
        const nodeData = [
            { id: 1, title: "STAGE 1: SENSOR SWARM", desc: "Stochastic Resonance: Utilizing chaotic background noise of the solar wind to amplify incredibly faint, hidden cosmic signals.", url: "stochastic_resonance.html", color: 0x00ff66, distance: 25, speed: 0.002, size: 2 },
            { id: 2, title: "STAGE 2: INGESTION ROUTER", desc: "Untangling the Firehose: Fast Fourier Transform (FFT) algorithms instantly separate massive power yields from complex acoustic vibrations.", url: "06_fft_router.html", color: 0xff00ff, distance: 35, speed: 0.0015, size: 2.5 },
            { id: 3, title: "STAGE 3: MEMORY ENGINE", desc: "Inverse Scattering: Machine Learning Core uses advanced mathematics (Radon Transform) to reconstruct a perfect 3D memory of unseen anomalies.", url: "inverse_scattering.html", color: 0xffaa00, distance: 45, speed: 0.001, size: 2.2 },
            { id: 4, title: "STAGE 4: PHONONIC FORGE", desc: "Von Neumann Assembly: Acoustic resonance waves physically force superheated asteroid plasma to crystallize into highly evolved Smart Rocks.", url: "phononic_forge.html", color: 0xff0055, distance: 55, speed: 0.0008, size: 3 }
        ];

        nodeData.forEach((data, index) => {
            const geo = new THREE.SphereGeometry(data.size, 32, 32);
            const mat = new THREE.MeshStandardMaterial({ 
                color: data.color, 
                emissive: data.color,
                emissiveIntensity: 0.5,
                roughness: 0.1,
                metalness: 0.8
            });
            const mesh = new THREE.Mesh(geo, mat);
            
            // Initial positioning
            const angle = (index / nodeData.length) * Math.PI * 2;
            mesh.position.x = Math.cos(angle) * data.distance;
            mesh.position.z = Math.sin(angle) * data.distance;
            
            // Store data inside the 3D object for the Raycaster to read
            mesh.userData = data; 
            mesh.userData.angle = angle; // Store current orbital angle

            // Add an orbital ring line so the user sees the path
            const ringGeo = new THREE.RingGeometry(data.distance - 0.2, data.distance + 0.2, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: data.color, side: THREE.DoubleSide, transparent: true, opacity: 0.1 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2; // Lay it flat
            scene.add(ring);

            scene.add(mesh);
            nodes.push(mesh);
        });

        // --- INTERACTION LOGIC (RAYCASTER) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        const targetInfo = document.getElementById('target-info');
        const targetTitle = document.getElementById('target-title');
        const targetDesc = document.getElementById('target-desc');
        
        let hoveredNode = null;

        // Track mouse movement to project 2D mouse coordinates into the 3D scene
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Handle Clicks
        window.addEventListener('click', () => {
            if (hoveredNode && hoveredNode.userData.url) {
                // The user clicked a planet. Launch the simulator.
                window.location.href = hoveredNode.userData.url;
            }
        });

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Rotate the Central Star
            centralStar.rotation.y += 0.005;
            centralStar.rotation.x += 0.002;

            // 2. Rotate the Swarm Particle System
            swarmSystem.rotation.y += 0.001;
            swarmSystem.rotation.z += 0.0005;

            // 3. Orbit the Planetary Nodes
            nodes.forEach(node => {
                node.userData.angle += node.userData.speed;
                node.position.x = Math.cos(node.userData.angle) * node.userData.distance;
                node.position.z = Math.sin(node.userData.angle) * node.userData.distance;
                node.rotation.y += 0.01; // Spin on axis
            });

            // 4. Raycasting (Detecting Hover)
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes);

            if (intersects.length > 0) {
                if (hoveredNode !== intersects[0].object) {
                    hoveredNode = intersects[0].object;
                    // Enlarge the hovered planet slightly
                    hoveredNode.scale.set(1.2, 1.2, 1.2);
                    
                    // Update HUD
                    targetTitle.innerText = hoveredNode.userData.title;
                    targetDesc.innerText = hoveredNode.userData.desc;
                    targetInfo.style.borderColor = '#' + hoveredNode.userData.color.toString(16).padStart(6, '0');
                    targetInfo.classList.add('active');
                    document.body.style.cursor = 'pointer';
                }
            } else {
                if (hoveredNode) {
                    // Reset the planet size when mouse leaves
                    hoveredNode.scale.set(1, 1, 1);
                    hoveredNode = null;
                    
                    // Hide HUD
                    targetInfo.classList.remove('active');
                    document.body.style.cursor = 'default';
                }
            }

            // Update controls and render frame
            controls.update();
            renderer.render(scene, camera);
        }

        // Initiate the Engine
        animate();
    </script>
</body>
</html>
